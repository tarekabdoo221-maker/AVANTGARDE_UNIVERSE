<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AVANTGARDE_UNIVERSE</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #071b35;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        /* Logo */

        header {
            padding: 20px;
        }

        .logo {
            width: 170px;
            height: auto;
        }

        /* Cover */

        .cover {
            width: 100%;
            display: block;
        }

        h1 {
            color: #d4af37;
            font-size: 38px;
            margin-top: 35px;
        }

        .intro {
            font-size: 20px;
            margin-bottom: 45px;
        }

        /* Products */

        .products-section {
            padding: 40px 0;
        }

        .main-products {
            width: 100%;
            height: auto;
            display: block;
            margin: 30px auto;
        }

        .products-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 35px;
            margin-top: 40px;
            padding: 20px;
        }

        .product-card {
            width: 380px;
            background-color: #102b4c;
            padding: 15px;
            border: 1px solid #d4af37;
            border-radius: 10px;
        }

        .product-card img {
            width: 100%;
            height: 320px;
            object-fit: contain;
        }

        /* PDF Catalog */

        .catalog-section {
            padding: 50px 20px;
            background-color: #102b4c;
        }

        .catalog-section h2 {
            color: #d4af37;
            font-size: 32px;
        }

        .catalog-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 25px;
            margin-top: 35px;
        }

        .catalog-btn {
            display: inline-block;
            background-color: #d4af37;
            color: #071b35;
            padding: 18px 35px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            transition: 0.3s;
        }

        .catalog-btn:hover {
            background-color: white;
            transform: scale(1.05);
        }

        /* Footer */

        footer {
            padding: 25px;
            color: #d4af37;
            margin-top: 30px;
        }

        @media (max-width: 600px) {

            h1 {
                font-size: 28px;
            }

            .product-card {
                width: 90%;
            }

            .catalog-btn {
                width: 90%;
            }

        }

    </style>

</head>

<body>

    <!-- Company Logo -->

    <header>
        <img src="./Images/Logo.png" class="logo" alt="Company Logo">
    </header>


    <!-- Cover -->

    <section>

        <img src="./Images/Cover.png" class="cover" alt="Company Cover">

        <h1>AVANTGARDE UNIVERSE</h1>

        <p class="intro">
            Global Import & Export Company
        </p>

    </section>


    <!-- Products -->

    <section class="products-section">

        <h1>OUR PRODUCTS</h1>

        <img src="./Images/Products.png"
             class="main-products"
             alt="Our Products">

        <div class="products-container">

            <div class="product-card">
                <img src="./Images/product 1.png" alt="Product 1">
            </div>

            <div class="product-card">
                <img src="./Images/product 2.png" alt="Product 2">
            </div>

        </div>

    </section>


    <!-- PDF Catalog -->

    <section class="catalog-section">

        <h2>OUR PRODUCT CATALOGS</h2>

        <p>Explore our products through our catalogs</p>

        <div class="catalog-buttons">

            <a href="./files/product catalog 1.pdf"
               target="_blank"
               class="catalog-btn">
                PRODUCT CATALOG 1
            </a>

            <a href="./files/product catalog 2.pdf"
               target="_blank"
               class="catalog-btn">
                PRODUCT CATALOG 2
            </a>

        </div>

    </section>


    <!-- Footer -->

    <footer>

        <p>AVANTGARDE UNIVERSE © 2026</p>

    </footer>

</body>

</html>
